<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control simple de pacientes</title>
    <style>
      body {
        font-family: system-ui, Arial, sans-serif;
        margin: 0;
        background: #f5f7fb;
        color: #1d2633;
      }
      main {
        max-width: 900px;
        margin: 1rem auto 2rem;
        padding: 0 1rem;
      }
      .box {
        background: #fff;
        border: 1px solid #dbe3ef;
        border-radius: 10px;
        padding: 1rem;
        margin-bottom: 0.8rem;
      }
      h1, h2 { margin: 0 0 0.7rem; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 0.6rem;
      }
      label { font-size: 0.9rem; font-weight: 600; }
      input, select, button {
        width: 100%;
        box-sizing: border-box;
        padding: 0.55rem;
        border-radius: 8px;
        border: 1px solid #bdd0e8;
        margin-top: 0.2rem;
      }
      button { cursor: pointer; font-weight: 700; }
      .row-btns {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 0.5rem;
      }
      table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
      th, td { border-bottom: 1px solid #e6edf7; padding: 0.5rem; text-align: left; }
      .warn { background: #fff0e8; color: #8a2d0f; border: 1px solid #f1b394; border-radius: 8px; padding: 0.5rem; margin-bottom: 0.4rem; }
      .muted { color: #5f7086; }
    </style>
  </head>
  <body>
    <main>
      <h1>Control simple de pacientes</h1>

      <section class="box">
        <h2>Archivo de trabajo</h2>
        <p id="fileStatus" class="muted">Sin archivo seleccionado.</p>
        <div class="row-btns">
          <button id="createFileBtn" type="button">Crear archivo en Documentos</button>
          <button id="openFileBtn" type="button">Seleccionar archivo existente</button>
          <button id="saveBtn" type="button">Guardar ahora</button>
        </div>
      </section>

      <section class="box">
        <h2>Nuevo ingreso</h2>
        <form id="patientForm" class="grid">
          <div>
            <label for="name">Paciente</label>
            <input id="name" name="name" required />
          </div>
          <div>
            <label for="product">Producto (1-50)</label>
            <select id="product" name="product"></select>
          </div>
          <div>
            <label for="treatment">Tratamiento</label>
            <input id="treatment" name="treatment" placeholder="Ej: rec poste" required />
          </div>
          <div>
            <label for="paid">Abono</label>
            <input id="paid" name="paid" type="number" min="0" step="0.01" value="0" required />
          </div>
          <div>
            <label for="date">Fecha ingreso</label>
            <input id="date" name="date" type="date" required />
          </div>
          <div>
            <label>&nbsp;</label>
            <button type="submit">Agregar paciente</button>
          </div>
        </form>
      </section>


      <section class="box">
        <h2>Buscador</h2>
        <div class="grid">
          <div>
            <label for="searchText">Palabra clave (paciente, tratamiento o producto)</label>
            <input id="searchText" type="text" placeholder="Ej: REC POSTE / ANA / PRODUCTO 8" />
          </div>
          <div>
            <label for="searchDate">Fecha de ingreso</label>
            <input id="searchDate" type="date" />
          </div>
          <div>
            <label>&nbsp;</label>
            <button id="clearSearchBtn" type="button">Limpiar búsqueda</button>
          </div>
        </div>
      </section>

      <section class="box">
        <h2>Alertas (+10 días con deuda)</h2>
        <div id="warnings" class="muted">Sin alertas.</div>
      </section>

      <section class="box">
        <h2>Pacientes</h2>
        <table>
          <thead>
            <tr>
              <th>Paciente</th><th>Producto</th><th>Tratamiento</th><th>Total</th><th>Abonado</th><th>Saldo</th><th>Ingreso</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </main>

    <script>
      const WARNING_DAYS = 10;
      const LOCAL_DATA_KEY = "clinic_data_backup";
      const DB_NAME = "clinic_file_db";
      const STORE_NAME = "kv";

      let fileHandle = null;
      let data = { patients: [] };

      const form = document.getElementById("patientForm");
      const rowsEl = document.getElementById("rows");
      const warningsEl = document.getElementById("warnings");
      const fileStatusEl = document.getElementById("fileStatus");
      const productEl = document.getElementById("product");
      const searchTextEl = document.getElementById("searchText");
      const searchDateEl = document.getElementById("searchDate");
      const clearSearchBtn = document.getElementById("clearSearchBtn");

      const products = Array.from({ length: 50 }, (_, i) => ({
        code: i + 1,
        name: `Producto ${i + 1}`,
        price: 50 + (i + 1) * 15,
      }));

      const fmt = (n) => new Intl.NumberFormat("es-ES", { style: "currency", currency: "USD" }).format(n);

      function daysBetween(a, b) {
        return Math.floor((new Date(b) - new Date(a)) / 86400000);
      }

      function renderProducts() {
        productEl.innerHTML = products.map((p) => `<option value="${p.code}">${p.name} - ${fmt(p.price)}</option>`).join("");
      }

      function normalize(value) {
        return String(value || "").toUpperCase();
      }

      function applyFilters(patients) {
        const query = normalize(searchTextEl.value).trim();
        const date = searchDateEl.value;

        return patients.filter((p) => {
          const matchesDate = !date || p.date === date;
          if (!matchesDate) return false;

          if (!query) return true;
          const haystack = normalize(`${p.name} ${p.productName} ${p.treatment}`);
          return haystack.includes(query);
        });
      }

      function render() {
        const filteredPatients = applyFilters(data.patients);

        if (!filteredPatients.length) {
          rowsEl.innerHTML = '<tr><td colspan="7" class="muted">No hay resultados.</td></tr>';
        } else {
          rowsEl.innerHTML = filteredPatients.map((p) => {
            const balance = Math.max(0, p.total - p.paid);
            return `<tr>
              <td>${p.name}</td><td>${p.productName}</td><td>${p.treatment}</td><td>${fmt(p.total)}</td><td>${fmt(p.paid)}</td><td>${fmt(balance)}</td><td>${p.date}</td>
            </tr>`;
          }).join("");
        }

        const today = new Date().toISOString().slice(0, 10);
        const delayed = data.patients.filter((p) => (p.total - p.paid) > 0 && daysBetween(p.date, today) > WARNING_DAYS);
        warningsEl.innerHTML = delayed.length
          ? delayed.map((p) => `<div class="warn">${p.name}: saldo ${fmt(p.total - p.paid)} con ${daysBetween(p.date, today)} días.</div>`).join("")
          : '<span class="muted">Sin alertas.</span>';
      }

      async function openDb() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function idbSet(key, value) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readwrite");
          tx.objectStore(STORE_NAME).put(value, key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }

      async function idbGet(key) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readonly");
          const req = tx.objectStore(STORE_NAME).get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function writeFile() {
        if (!fileHandle) {
          fileStatusEl.textContent = "Selecciona o crea un archivo primero.";
          return;
        }
        const writable = await fileHandle.createWritable();
        await writable.write(JSON.stringify(data, null, 2));
        await writable.close();
        localStorage.setItem(LOCAL_DATA_KEY, JSON.stringify(data));
        fileStatusEl.textContent = `Archivo activo: ${fileHandle.name}`;
      }

      async function loadFromFile() {
        if (!fileHandle) return;
        try {
          const file = await fileHandle.getFile();
          const text = await file.text();
          data = text ? JSON.parse(text) : { patients: [] };
          if (!Array.isArray(data.patients)) data.patients = [];
          localStorage.setItem(LOCAL_DATA_KEY, JSON.stringify(data));
          render();
          fileStatusEl.textContent = `Archivo activo: ${fileHandle.name}`;
        } catch {
          fileStatusEl.textContent = "No se pudo leer el archivo. Se usará respaldo local.";
        }
      }

      async function chooseCreateFile() {
        if (!("showSaveFilePicker" in window)) {
          fileStatusEl.textContent = "Tu navegador no soporta File System Access API.";
          return;
        }
        const name = `control_pacientes_${new Date().toISOString().slice(0, 10)}.json`;
        fileHandle = await window.showSaveFilePicker({
          suggestedName: name,
          startIn: "documents",
          types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
        });
        await idbSet("fileHandle", fileHandle);
        await writeFile();
      }

      async function chooseOpenFile() {
        if (!("showOpenFilePicker" in window)) {
          fileStatusEl.textContent = "Tu navegador no soporta File System Access API.";
          return;
        }
        const [handle] = await window.showOpenFilePicker({
          startIn: "documents",
          multiple: false,
          types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
        });
        fileHandle = handle;
        await idbSet("fileHandle", fileHandle);
        await loadFromFile();
      }

      async function bootFile() {
        const backup = localStorage.getItem(LOCAL_DATA_KEY);
        data = backup ? JSON.parse(backup) : { patients: [] };
        if (!Array.isArray(data.patients)) data = { patients: [] };
        render();

        try {
          const savedHandle = await idbGet("fileHandle");
          if (savedHandle) {
            fileHandle = savedHandle;
            await loadFromFile();
          }
        } catch {
          fileStatusEl.textContent = "No se pudo recuperar archivo previo."
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        const code = Number(fd.get("product"));
        const product = products.find((p) => p.code === code);

        const patient = {
          id: crypto.randomUUID(),
          name: normalize(String(fd.get("name") || "").trim()),
          productCode: product.code,
          productName: normalize(product.name),
          treatment: normalize(String(fd.get("treatment") || "").trim()),
          total: product.price,
          paid: Number(fd.get("paid") || 0),
          date: String(fd.get("date") || ""),
        };

        if (!patient.name || !patient.treatment || !patient.date) return;
        data.patients.unshift(patient);
        render();
        localStorage.setItem(LOCAL_DATA_KEY, JSON.stringify(data));
        if (fileHandle) await writeFile();
        form.reset();
        document.getElementById("paid").value = "0";
        document.getElementById("date").value = new Date().toISOString().slice(0, 10);
      });

      document.getElementById("createFileBtn").addEventListener("click", chooseCreateFile);
      document.getElementById("openFileBtn").addEventListener("click", chooseOpenFile);
      document.getElementById("saveBtn").addEventListener("click", writeFile);

      searchTextEl.addEventListener("input", render);
      searchDateEl.addEventListener("change", render);
      clearSearchBtn.addEventListener("click", () => {
        searchTextEl.value = "";
        searchDateEl.value = "";
        render();
      });

      renderProducts();
      document.getElementById("date").value = new Date().toISOString().slice(0, 10);
      bootFile();
    </script>
  </body>
</html>
