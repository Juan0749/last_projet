<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control simple de pacientes</title>
    <style>
      body {
        font-family: system-ui, Arial, sans-serif;
        margin: 0;
        background: #f5f7fb;
        color: #1d2633;
      }
      main {
        max-width: 980px;
        margin: 1rem auto 2rem;
        padding: 0 1rem;
      }
      .box {
        background: #fff;
        border: 1px solid #dbe3ef;
        border-radius: 10px;
        padding: 1rem;
        margin-bottom: 0.8rem;
      }
      h1,
      h2 {
        margin: 0 0 0.7rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 0.6rem;
      }
      .grid-centered {
        max-width: 760px;
        margin: 0 auto;
      }
      label {
        font-size: 0.9rem;
        font-weight: 600;
      }
      input,
      select,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 0.55rem;
        border-radius: 8px;
        border: 1px solid #bdd0e8;
        margin-top: 0.2rem;
      }
      button {
        cursor: pointer;
        font-weight: 700;
      }
      .row-btns {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 0.5rem;
      }
      .search-toggle {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        width: auto;
        padding: 0.45rem 0.75rem;
      }
      .search-panel {
        margin-top: 0.7rem;
      }
      .hidden {
        display: none;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      th,
      td {
        border-bottom: 1px solid #e6edf7;
        padding: 0.5rem;
        text-align: left;
      }
      .warn {
        background: #fff0e8;
        color: #8a2d0f;
        border: 1px solid #f1b394;
        border-radius: 8px;
        padding: 0.5rem;
        margin-bottom: 0.4rem;
      }
      .muted {
        color: #5f7086;
      }
      .status-debt {
        color: #b42318;
        font-weight: 800;
        background: #fee4e2;
        border: 1px solid #fecdca;
        border-radius: 6px;
        padding: 0.2rem 0.45rem;
      }
      .status-favor {
        color: #067647;
        font-weight: 700;
      }
      .status-ok {
        color: #175cd3;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Control simple de pacientes</h1>

      <section class="box">
        <h2>Archivo de trabajo</h2>
        <p id="fileStatus" class="muted">Sin archivo seleccionado.</p>
        <div class="row-btns">
          <button id="createFileBtn" type="button">Crear archivo en Documentos</button>
          <button id="openFileBtn" type="button">Seleccionar archivo existente</button>
          <button id="saveBtn" type="button">Guardar ahora</button>
        </div>
      </section>

      <section class="box">
        <h2>Nuevo ingreso</h2>
        <form id="patientForm" class="grid">
          <div>
            <label for="name">Paciente</label>
            <input id="name" name="name" required />
          </div>
          <div>
            <label for="product">Producto (1-50)</label>
            <select id="product" name="product"></select>
          </div>
          <div>
            <label for="treatment">Tratamiento</label>
            <input id="treatment" name="treatment" placeholder="Ej: rec poste" required />
          </div>
          <div>
            <label for="paid">Abono</label>
            <input id="paid" name="paid" type="number" min="0" step="0.01" value="0" required />
          </div>
          <div>
            <label for="date">Fecha ingreso</label>
            <input id="date" name="date" type="date" required />
          </div>
          <div>
            <label>&nbsp;</label>
            <button type="submit">Agregar paciente</button>
          </div>
        </form>
      </section>

      <section class="box">
        <h2>Buscador</h2>
        <button id="toggleSearchBtn" class="search-toggle" type="button">
          <span id="toggleIcon">🔎</span>
          <span id="toggleText">Abrir búsqueda</span>
        </button>
        <div id="searchPanel" class="search-panel hidden">
          <div class="grid grid-centered">
            <div>
              <label for="searchText">Palabra clave (paciente, tratamiento o producto)</label>
              <input id="searchText" type="text" placeholder="Ej: REC POSTE / ANA / PRODUCTO 8" />
            </div>
            <div>
              <label for="searchStartDate">Fecha inicio</label>
              <input id="searchStartDate" type="date" />
            </div>
            <div>
              <label for="searchEndDate">Fecha fin</label>
              <input id="searchEndDate" type="date" />
            </div>
            <div>
              <label>&nbsp;</label>
              <button id="clearSearchBtn" type="button">Limpiar búsqueda</button>
            </div>
          </div>
        </div>
      </section>

      <section class="box">
        <h2>Alertas (+10 días con deuda)</h2>
        <div id="warnings" class="muted">Sin alertas.</div>
      </section>

      <section class="box">
        <h2>Pacientes</h2>
        <table>
          <thead>
            <tr>
              <th>Paciente</th>
              <th>Producto</th>
              <th>Tratamiento</th>
              <th>Total</th>
              <th>Abonado</th>
              <th>Estado de saldo</th>
              <th>Ingreso</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </main>

    <script>
      const WARNING_DAYS = 10;
      const LOCAL_DATA_KEY = "clinic_data_backup";
      const DB_NAME = "clinic_file_db";
      const STORE_NAME = "kv";

      let fileHandle = null;
      let data = { patients: [] };

      const form = document.getElementById("patientForm");
      const rowsEl = document.getElementById("rows");
      const warningsEl = document.getElementById("warnings");
      const fileStatusEl = document.getElementById("fileStatus");
      const productEl = document.getElementById("product");
      const searchTextEl = document.getElementById("searchText");
      const searchStartDateEl = document.getElementById("searchStartDate");
      const searchEndDateEl = document.getElementById("searchEndDate");
      const clearSearchBtn = document.getElementById("clearSearchBtn");
      const toggleSearchBtn = document.getElementById("toggleSearchBtn");
      const searchPanel = document.getElementById("searchPanel");
      const toggleText = document.getElementById("toggleText");
      const toggleIcon = document.getElementById("toggleIcon");

      const products = Array.from({ length: 50 }, (_, i) => ({
        code: i + 1,
        name: `PRODUCTO ${i + 1}`,
        price: 50 + (i + 1) * 15,
      }));

      const fmt = (n) =>
        new Intl.NumberFormat("es-ES", {
          style: "currency",
          currency: "USD",
        }).format(n);

      function normalize(value) {
        return String(value || "").trim().toUpperCase();
      }

      function parseSafeDate(dateText) {
        const date = new Date(`${dateText}T00:00:00`);
        return Number.isNaN(date.getTime()) ? null : date;
      }

      function daysBetween(dateText, compareText) {
        const a = parseSafeDate(dateText);
        const b = parseSafeDate(compareText);
        if (!a || !b) return -1;
        return Math.floor((b - a) / 86400000);
      }

      function renderProducts() {
        productEl.innerHTML = products
          .map((p) => `<option value="${p.code}">${p.name} - ${fmt(p.price)}</option>`)
          .join("");
      }

      function getBalance(patient) {
        return Number(patient.total || 0) - Number(patient.paid || 0);
      }

      function getBalanceHtml(balance) {
        if (balance > 0) {
          return `<span class="status-debt">FALTANTE ${fmt(balance)}</span>`;
        }
        if (balance < 0) {
          return `<span class="status-favor">A FAVOR ${fmt(Math.abs(balance))}</span>`;
        }
        return '<span class="status-ok">AL DÍA</span>';
      }

      function applyFilters(patients) {
        const query = normalize(searchTextEl.value);
        const startDate = searchStartDateEl.value;
        const endDate = searchEndDateEl.value;

        return patients.filter((p) => {
          const recordDate = p.date;
          const matchesStart = !startDate || recordDate >= startDate;
          const matchesEnd = !endDate || recordDate <= endDate;
          if (!matchesStart || !matchesEnd) return false;

          if (!query) return true;
          const haystack = normalize(`${p.name} ${p.productName} ${p.treatment}`);
          return haystack.includes(query);
        });
      }

      function renderWarnings() {
        const today = new Date().toISOString().slice(0, 10);
        const delayed = data.patients.filter((p) => {
          const days = daysBetween(p.date, today);
          const debt = getBalance(p);
          return days > WARNING_DAYS && debt > 0;
        });

        if (!delayed.length) {
          warningsEl.innerHTML = '<span class="muted">Sin alertas.</span>';
          return;
        }

        warningsEl.innerHTML = delayed
          .map((p) => {
            const debt = getBalance(p);
            const overdueDays = daysBetween(p.date, today);
            return `<div class="warn"><strong>${p.name}</strong> lleva <strong>${overdueDays} días</strong> con deuda pendiente de <strong>${fmt(debt)}</strong>.</div>`;
          })
          .join("");
      }

      function render() {
        const filteredPatients = applyFilters(data.patients);

        if (!filteredPatients.length) {
          rowsEl.innerHTML = '<tr><td colspan="7" class="muted">No hay resultados.</td></tr>';
        } else {
          rowsEl.innerHTML = filteredPatients
            .map((p) => {
              const balance = getBalance(p);
              return `<tr>
              <td>${p.name}</td>
              <td>${p.productName}</td>
              <td>${p.treatment}</td>
              <td>${fmt(p.total)}</td>
              <td>${fmt(p.paid)}</td>
              <td>${getBalanceHtml(balance)}</td>
              <td>${p.date}</td>
            </tr>`;
            })
            .join("");
        }

        renderWarnings();
      }

      async function openDb() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function idbSet(key, value) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readwrite");
          tx.objectStore(STORE_NAME).put(value, key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }

      async function idbGet(key) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readonly");
          const req = tx.objectStore(STORE_NAME).get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function writeFile() {
        if (!fileHandle) {
          fileStatusEl.textContent = "Selecciona o crea un archivo primero.";
          return;
        }
        const writable = await fileHandle.createWritable();
        await writable.write(JSON.stringify(data, null, 2));
        await writable.close();
        localStorage.setItem(LOCAL_DATA_KEY, JSON.stringify(data));
        fileStatusEl.textContent = `Archivo activo: ${fileHandle.name}`;
      }

      async function loadFromFile() {
        if (!fileHandle) return;
        try {
          const file = await fileHandle.getFile();
          const text = await file.text();
          data = text ? JSON.parse(text) : { patients: [] };
          if (!Array.isArray(data.patients)) data.patients = [];
          localStorage.setItem(LOCAL_DATA_KEY, JSON.stringify(data));
          render();
          fileStatusEl.textContent = `Archivo activo: ${fileHandle.name}`;
        } catch {
          fileStatusEl.textContent = "No se pudo leer el archivo. Se usará respaldo local.";
          render();
        }
      }

      async function chooseCreateFile() {
        if (!("showSaveFilePicker" in window)) {
          fileStatusEl.textContent = "Tu navegador no soporta File System Access API.";
          return;
        }
        const name = `control_pacientes_${new Date().toISOString().slice(0, 10)}.json`;
        fileHandle = await window.showSaveFilePicker({
          suggestedName: name,
          startIn: "documents",
          types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
        });
        await idbSet("fileHandle", fileHandle);
        await writeFile();
      }

      async function chooseOpenFile() {
        if (!("showOpenFilePicker" in window)) {
          fileStatusEl.textContent = "Tu navegador no soporta File System Access API.";
          return;
        }
        const [handle] = await window.showOpenFilePicker({
          startIn: "documents",
          multiple: false,
          types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
        });
        fileHandle = handle;
        await idbSet("fileHandle", fileHandle);
        await loadFromFile();
      }

      function toggleSearchPanel() {
        const isHidden = searchPanel.classList.toggle("hidden");
        toggleText.textContent = isHidden ? "Abrir búsqueda" : "Cerrar búsqueda";
        toggleIcon.textContent = isHidden ? "🔎" : "🔽";
      }

      async function bootFile() {
        const backup = localStorage.getItem(LOCAL_DATA_KEY);
        data = backup ? JSON.parse(backup) : { patients: [] };
        if (!Array.isArray(data.patients)) data = { patients: [] };
        render();

        try {
          const savedHandle = await idbGet("fileHandle");
          if (savedHandle) {
            fileHandle = savedHandle;
            await loadFromFile();
          }
        } catch {
          fileStatusEl.textContent = "No se pudo recuperar archivo previo.";
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        const code = Number(fd.get("product"));
        const product = products.find((p) => p.code === code);
        const paidValue = Number.parseFloat(fd.get("paid"));

        const patient = {
          id: crypto.randomUUID(),
          name: normalize(fd.get("name")),
          productCode: product.code,
          productName: normalize(product.name),
          treatment: normalize(fd.get("treatment")),
          total: product.price,
          paid: Number.isFinite(paidValue) ? paidValue : 0,
          date: String(fd.get("date") || ""),
        };

        if (!patient.name || !patient.treatment || !patient.date) return;
        data.patients.unshift(patient);
        render();
        localStorage.setItem(LOCAL_DATA_KEY, JSON.stringify(data));
        if (fileHandle) await writeFile();
        form.reset();
        document.getElementById("paid").value = "0";
        document.getElementById("date").value = new Date().toISOString().slice(0, 10);
      });

      document.getElementById("createFileBtn").addEventListener("click", chooseCreateFile);
      document.getElementById("openFileBtn").addEventListener("click", chooseOpenFile);
      document.getElementById("saveBtn").addEventListener("click", writeFile);
      toggleSearchBtn.addEventListener("click", toggleSearchPanel);
      searchTextEl.addEventListener("input", render);
      searchStartDateEl.addEventListener("change", render);
      searchEndDateEl.addEventListener("change", render);
      clearSearchBtn.addEventListener("click", () => {
        searchTextEl.value = "";
        searchStartDateEl.value = "";
        searchEndDateEl.value = "";
        render();
      });

      renderProducts();
      document.getElementById("date").value = new Date().toISOString().slice(0, 10);
      bootFile();
    </script>
  </body>
</html>
